name: Build ZIL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows-VST3 }
          - { os: macos-latest,   name: macOS-VST3-AU }
          - { os: ubuntu-latest,  name: Linux-VST3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl-dev libfontconfig1-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZIL_BUILD_TESTS=OFF ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: ZIL-${{ matrix.name }}
          path: |
            build/ZIL_artefacts/Release/VST3
            build/ZIL_artefacts/Release/AU
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a pkg/ZIL-Windows-VST3.zip ./build/ZIL_artefacts/Release/VST3/ZIL.vst3 ./build/ZIL_artefacts/Release/Standalone/ZIL.exe
            cp ./build/ZIL_artefacts/Release/VST3/ZIL.vst3/Contents/x86_64-win/ZIL.vst3 pkg/ZIL.dll
            grep -aq VSTPluginMain pkg/ZIL.dll || { echo 'VSTPluginMain export missing'; exit 1; }
            7z a pkg/ZIL-Windows-VST2-dll.zip pkg/ZIL.dll
            rm pkg/ZIL.dll
            7z a pkg/ZIL-Windows-single-file.zip ./build/ZIL_artefacts/Release/VST3/ZIL.vst3/Contents/x86_64-win/ZIL.vst3
          elif [ "$RUNNER_OS" = "macOS" ]; then (cd build/ZIL_artefacts/Release && zip -qr ../../../pkg/ZIL-macOS-VST3-AU.zip VST3 AU)
          else (cd build/ZIL_artefacts/Release && zip -qr ../../../pkg/ZIL-Linux-VST3.zip VST3); fi
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "ZIL latest build" --notes "Automatic build of the main branch. Windows: unzip and copy ZIL.vst3 to C:\\Program Files\\Common Files\\VST3\\" --target "$GITHUB_SHA"
          gh release upload latest pkg/*.zip --clobber
